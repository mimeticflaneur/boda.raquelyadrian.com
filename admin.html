<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin · Boda R&A</title>
    <style>
        :root { --ink:#161413; --paper:#f5f2ec; --warm:#eae5db; --sienna:#9e4a2f; --mute:#6b6661; --rule:rgba(0,0,0,.08); }
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#fafaf7;color:var(--ink);padding:2rem 1.5rem;line-height:1.5}
        .wrap{max-width:1280px;margin:0 auto}
        header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2rem;padding-bottom:1.5rem;border-bottom:1px solid var(--rule)}
        h1{font-family:Georgia,serif;font-weight:400;font-size:1.8rem;letter-spacing:-.01em}
        h1 em{font-style:italic;color:var(--sienna)}
        .updated{font-size:.7rem;text-transform:uppercase;letter-spacing:.15em;color:var(--mute)}
        .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.8rem;margin-bottom:2rem}
        .stat{background:#fff;padding:1.1rem 1.2rem;border-left:3px solid var(--sienna)}
        .stat-n{font-family:Georgia,serif;font-size:1.8rem;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
        .stat-l{font-size:.65rem;text-transform:uppercase;letter-spacing:.18em;color:var(--mute);margin-top:.4rem}
        .tabs{display:flex;gap:0;border-bottom:1px solid var(--rule);margin-bottom:1.2rem;flex-wrap:wrap}
        .tab{background:none;border:none;padding:.8rem 1.4rem;cursor:pointer;font-size:.75rem;text-transform:uppercase;letter-spacing:.18em;color:var(--mute);font-weight:500;border-bottom:2px solid transparent;transition:all .2s}
        .tab:hover{color:var(--ink)}
        .tab.active{color:var(--sienna);border-bottom-color:var(--sienna)}
        .tab-count{display:inline-block;margin-left:.4rem;padding:.05rem .4rem;background:var(--warm);border-radius:8px;font-size:.65rem;color:var(--mute)}
        .tab.active .tab-count{background:var(--sienna);color:#fff}
        .actions{display:flex;gap:.5rem;margin-bottom:1rem;justify-content:flex-end}
        .btn{background:var(--ink);color:var(--paper);border:none;padding:.55rem 1.1rem;cursor:pointer;font-size:.7rem;text-transform:uppercase;letter-spacing:.15em;font-weight:500;font-family:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:.4rem}
        .btn:hover{background:var(--sienna)}
        .btn.secondary{background:transparent;color:var(--ink);border:1px solid var(--ink)}
        .btn.secondary:hover{background:var(--ink);color:var(--paper)}
        table{width:100%;border-collapse:collapse;background:#fff;font-size:.85rem}
        th,td{padding:.7rem .8rem;text-align:left;border-bottom:1px solid var(--rule);vertical-align:top}
        th{background:var(--warm);font-weight:600;font-size:.65rem;text-transform:uppercase;letter-spacing:.15em;color:var(--mute);white-space:nowrap}
        tbody tr:hover{background:#fcfaf6}
        .badge{display:inline-block;padding:.15rem .55rem;border-radius:2px;font-size:.7rem;font-weight:500;text-transform:uppercase;letter-spacing:.1em}
        .badge-si{background:#d4edda;color:#155724}
        .badge-no{background:#f8d7da;color:#721c24}
        .badge-solo_ceremonia{background:#fff3cd;color:#856404}
        .empty{padding:4rem 2rem;text-align:center;color:var(--mute);background:#fff;font-style:italic}
        small.sub{color:var(--mute);font-size:.7rem}
        .filters{display:flex;gap:.4rem;margin-bottom:1rem;flex-wrap:wrap}
        .filter{padding:.3rem .7rem;font-size:.7rem;background:#fff;border:1px solid var(--rule);cursor:pointer;text-transform:uppercase;letter-spacing:.1em;color:var(--mute)}
        .filter.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}
        .err{padding:2rem;background:#fff;text-align:center;color:#721c24}
        @media (max-width:768px){body{padding:1rem .75rem}table{font-size:.78rem}th,td{padding:.5rem .55rem}}
    </style>
</head>
<body>
    <div class="wrap">
        <header>
            <h1>Admin · Boda Raquel <em>&</em> Adrián</h1>
            <div class="updated" id="updated">—</div>
        </header>
        <div class="stats" id="stats"></div>
        <div class="tabs" id="tabs">
            <button class="tab active" data-t="rsvp">RSVPs <span class="tab-count" id="c-rsvp">0</span></button>
            <button class="tab" data-t="song">Canciones <span class="tab-count" id="c-song">0</span></button>
            <button class="tab" data-t="guestbook">Firmas <span class="tab-count" id="c-guestbook">0</span></button>
        </div>
        <div class="filters" id="filters"></div>
        <div class="actions">
            <button class="btn secondary" onclick="reload()">↻ Recargar</button>
            <a class="btn" id="export-btn" href="/api/admin/export?type=rsvp" download>↓ CSV</a>
        </div>
        <div id="content" class="empty">Cargando…</div>
    </div>

    <script>
    let data = { rsvp: [], song: [], guestbook: [] };
    let current = 'rsvp';
    let filter = 'all';

    async function reload() {
        document.getElementById('content').className = 'empty';
        document.getElementById('content').textContent = 'Cargando…';
        try {
            const r = await fetch('/api/admin/list', { cache: 'no-store' });
            if (!r.ok) throw new Error(r.status);
            data = await r.json();
            document.getElementById('updated').textContent = 'Actualizado ' + new Date().toLocaleTimeString('es-ES');
            ['rsvp','song','guestbook'].forEach(t => document.getElementById('c-'+t).textContent = (data[t]||[]).length);
            renderStats();
            renderTab(current);
        } catch (e) {
            document.getElementById('content').className = 'err';
            document.getElementById('content').textContent = 'Error cargando datos: ' + e.message;
        }
    }

    function renderStats() {
        const rsvp = data.rsvp || [];
        const yes = rsvp.filter(r => r.asistencia === 'si');
        const cer = rsvp.filter(r => r.asistencia === 'solo_ceremonia');
        const no = rsvp.filter(r => r.asistencia === 'no');
        const totalGuests = yes.reduce((s, r) => s + 1 + (r.acompanantes?.length || 0), 0);
        const cerGuests = cer.length;
        const menus = { carne: 0, pescado: 0, vegano: 0 };
        yes.forEach(r => {
            if (r.mi_menu && menus.hasOwnProperty(r.mi_menu)) menus[r.mi_menu]++;
            (r.acompanantes || []).forEach(a => { if (a.menu && menus.hasOwnProperty(a.menu)) menus[a.menu]++; });
        });
        const bus = yes.filter(r => r.autobus === 'si').length;
        const allergies = yes.filter(r => r.alergias).length;

        document.getElementById('stats').innerHTML = `
            <div class="stat"><div class="stat-n">${totalGuests}</div><div class="stat-l">Al banquete</div></div>
            <div class="stat"><div class="stat-n">${cerGuests}</div><div class="stat-l">Solo ceremonia</div></div>
            <div class="stat"><div class="stat-n">${no.length}</div><div class="stat-l">No vienen</div></div>
            <div class="stat"><div class="stat-n">${menus.carne}</div><div class="stat-l">Carne</div></div>
            <div class="stat"><div class="stat-n">${menus.pescado}</div><div class="stat-l">Pescado</div></div>
            <div class="stat"><div class="stat-n">${menus.vegano}</div><div class="stat-l">Vegano</div></div>
            <div class="stat"><div class="stat-n">${bus}</div><div class="stat-l">Necesitan bus</div></div>
            <div class="stat"><div class="stat-n">${allergies}</div><div class="stat-l">Con alergias</div></div>
        `;
    }

    function renderFilters() {
        const f = document.getElementById('filters');
        if (current !== 'rsvp') { f.innerHTML = ''; return; }
        const opts = [['all','Todos'],['si','Vienen'],['solo_ceremonia','Solo ceremonia'],['no','No vienen']];
        f.innerHTML = opts.map(([v,l]) => `<button class="filter ${filter===v?'active':''}" onclick="setFilter('${v}')">${l}</button>`).join('');
    }

    function setFilter(f) { filter = f; renderFilters(); renderTab(current); }

    function renderTab(t) {
        current = t;
        document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.t === t));
        document.getElementById('export-btn').href = '/api/admin/export?type=' + t;
        renderFilters();

        let list = (data[t] || []).slice();
        if (t === 'rsvp' && filter !== 'all') list = list.filter(r => r.asistencia === filter);

        const c = document.getElementById('content');
        if (!list.length) { c.className = 'empty'; c.textContent = 'Sin entradas'; return; }
        c.className = '';

        if (t === 'rsvp') {
            c.innerHTML = `<table><thead><tr>
                <th>Fecha</th><th>Nombre</th><th>Asiste</th><th>Email · Tel</th>
                <th>Menú</th><th>Acompañantes</th><th>Alergias</th><th>Bus</th>
            </tr></thead><tbody>${list.map(r => `<tr>
                <td>${fmt(r.submittedAt)}</td>
                <td><strong>${esc(r.nombre)}</strong></td>
                <td><span class="badge badge-${esc(r.asistencia)}">${esc(r.asistencia || '')}</span></td>
                <td>${esc(r.email)}${r.telefono ? `<br><small class="sub">${esc(r.telefono)}</small>` : ''}</td>
                <td>${esc(r.mi_menu)}</td>
                <td>${(r.acompanantes || []).map(a => `${esc(a.nombre)} <small class="sub">(${esc(a.menu)})</small>`).join('<br>') || '—'}</td>
                <td>${esc(r.alergias) || '—'}</td>
                <td>${esc(r.autobus) || '—'}</td>
            </tr>`).join('')}</tbody></table>`;
        } else if (t === 'song') {
            c.innerHTML = `<table><thead><tr><th>Fecha</th><th>Canción</th><th>Artista</th><th>Sugerida por</th></tr></thead><tbody>${list.map(r => `<tr>
                <td>${fmt(r.submittedAt)}</td>
                <td><strong>${esc(r.cancion)}</strong></td>
                <td>${esc(r.artista) || '—'}</td>
                <td>${esc(r.nombre) || 'anónimo'}</td>
            </tr>`).join('')}</tbody></table>`;
        } else if (t === 'guestbook') {
            c.innerHTML = `<table><thead><tr><th>Fecha</th><th>Nombre</th><th>Mensaje</th></tr></thead><tbody>${list.map(r => `<tr>
                <td>${fmt(r.submittedAt)}</td>
                <td><strong>${esc(r.nombre)}</strong></td>
                <td>${esc(r.mensaje)}</td>
            </tr>`).join('')}</tbody></table>`;
        }
    }

    function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function fmt(s) { try { return new Date(s).toLocaleString('es-ES', {dateStyle:'short', timeStyle:'short'}); } catch { return s; } }

    document.querySelectorAll('.tab').forEach(b => b.onclick = () => renderTab(b.dataset.t));
    reload();
    </script>
</body>
</html>
